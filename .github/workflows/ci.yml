name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build emrtd-dotnet.slnx -c Release
      - run: dotnet test tests/Emrtd.Tests -c Release --no-build
      - run: dotnet pack src/Emrtd -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*
